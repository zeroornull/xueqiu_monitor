[project]
name = "xueqiu-monitor"
version = "0.1.0"
description = "监控雪球组合持仓变动，并推送到已启用的通知渠道"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.3",
    "playwright>=1.63.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.scripts]
xueqiu-monitor = "xueqiu_monitor.monitor:main"
xueqiu-login = "xueqiu_monitor.login:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xueqiu_monitor"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
